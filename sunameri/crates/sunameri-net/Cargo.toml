[package]
name = "sunameri-net"
description = "sunameri のネットワーク層: reqwest + rustls、Cookie 共有、ステータスとヘッダ付きの応答"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
blitz-traits = { workspace = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "brotli", "cookies"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
cookie_store = { version = "0.22", default-features = false, features = ["public_suffix", "serde_json"] }
cookie = "0.18"
tokio = { workspace = true }
url = { workspace = true }
data-url = { workspace = true }
log = "0.4"
