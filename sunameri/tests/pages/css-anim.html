<!doctype html><html><head><style>
@keyframes fadein { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
#box { width: 200px; height: 100px; background: #1d9bf0; opacity: 0; animation-name: fadein; animation-duration: 0.15s; animation-fill-mode: forwards; }
</style></head><body><div id="box"></div>
<script>setTimeout(() => { const cs = getComputedStyle(document.getElementById("box")); document.title = "opacity=" + cs.opacity + " transform=" + cs.transform; }, 800);</script>
</body></html>
