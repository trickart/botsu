<!doctype html>
<html><head><meta charset="utf-8"><title>fetch test</title></head>
<body><div id="out">waiting</div>
<script>
(async () => {
  try {
    const r = await fetch("https://httpbin.org/post", { method: "POST", headers: { "content-type": "application/json", "x-test": "1" }, body: JSON.stringify({ hello: "world" }) });
    console.log("fetch status=" + r.status + " ok=" + r.ok + " ct=" + r.headers.get("content-type"));
    const j = await r.json();
    console.log("fetch echo json=" + JSON.stringify(j.json) + " x-test=" + j.headers["X-Test"]);
    document.getElementById("out").textContent = "fetch OK: " + JSON.stringify(j.json);
  } catch (e) { console.log("fetch FAILED " + e + "\n" + e.stack); }
  const xhr = new XMLHttpRequest();
  xhr.open("GET", "https://httpbin.org/get?q=1");
  xhr.onload = () => console.log("xhr status=" + xhr.status + " len=" + xhr.responseText.length + " q=" + JSON.parse(xhr.responseText).args.q);
  xhr.onerror = () => console.log("xhr FAILED");
  xhr.send();
  // 動的 script
  const s = document.createElement("script");
  s.src = "https://unpkg.com/lodash@4.17.21/lodash.min.js";
  s.onload = () => console.log("dynamic script loaded, _.VERSION=" + window._.VERSION);
  s.onerror = () => console.log("dynamic script FAILED");
  document.head.appendChild(s);
  // Event
  const el = document.getElementById("out");
  el.addEventListener("custom", (e) => console.log("custom event received detail=" + e.detail + " bubbles=" + e.bubbles + " target ok=" + (e.target === el)));
  window.addEventListener("custom", () => console.log("custom event reached window"));
  el.dispatchEvent(new CustomEvent("custom", { detail: 42, bubbles: true }));
  console.log("Intl: " + new Intl.DateTimeFormat("ja-JP", { dateStyle: "long" }).format(new Date(0)) + " / " + new Intl.NumberFormat("ja-JP").format(1234567));
  console.log("history: " + (history.pushState({a:1}, "", "/foo?x=1"), location.pathname + location.search) + " state=" + JSON.stringify(history.state));
  localStorage.setItem("k", "v"); console.log("localStorage: " + localStorage.getItem("k") + " " + localStorage.k + " len=" + localStorage.length);
  console.log("matchMedia: " + matchMedia("(max-width: 1200px)").matches + " " + matchMedia("(prefers-color-scheme: dark)").matches);
  console.log("cookie: [" + document.cookie + "]");
  document.cookie = "a=1; path=/";
  console.log("cookie after set: [" + document.cookie + "]");
  console.log("crypto: " + crypto.randomUUID().length + " " + crypto.getRandomValues(new Uint8Array(4)).length);
  console.log("insertAdjacentHTML: " + (el.insertAdjacentHTML("beforeend", "<b>bold</b>"), el.innerHTML));
})();
</script>
</body></html>
